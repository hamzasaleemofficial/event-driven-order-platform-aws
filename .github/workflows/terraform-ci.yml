name: Terraform CI/CD

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      apply:
        description: "Apply Terraform changes to dev"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-ci:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../../

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

  terraform-plan:
    name: Terraform Plan and Apply
    needs: terraform-ci
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda packages
        working-directory: ${{ github.workspace }}
        run: |
          for service in api worker; do
            rm -rf "application/${service}/package"
            mkdir -p "application/${service}/package"

            python -m pip install \
              -r "application/${service}/requirements.txt" \
              -t "application/${service}/package" \
              --no-compile

            cp application/${service}/*.py "application/${service}/package/"
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-1
          role-session-name: terraform-deployment

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Terraform Plan
        env:
          TF_VAR_monitoring_alert_email: ${{ secrets.MONITORING_ALERT_EMAIL }}
        run: |
          terraform plan \
            -var-file=terraform.tfvars.example \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true && github.ref == 'refs/heads/dev'
        run: |
          terraform apply \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            tfplan