name: Python CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  python-ci:
    name: Python Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            application/api/requirements.txt
            application/worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r application/api/requirements.txt
          python -m pip install -r application/worker/requirements.txt
          python -m pip install pytest ruff

      - name: Check Python linting
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Run automated tests
        run: python -m pytest -q